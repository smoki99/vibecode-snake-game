<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="og-title og-desc">
  <style>
    /* Vendored, OFL-licensed, latin-subset. Paths are relative to assets/brand/. */
    @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400;src:url('../fonts/space-grotesk-latin-400-normal.woff2') format('woff2')}
    @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500;src:url('../fonts/space-grotesk-latin-500-normal.woff2') format('woff2')}
    @font-face{font-family:'Silkscreen';font-style:normal;font-weight:400;src:url('../fonts/silkscreen-latin-400-normal.woff2') format('woff2')}
    @font-face{font-family:'Silkscreen';font-style:normal;font-weight:700;src:url('../fonts/silkscreen-latin-700-normal.woff2') format('woff2')}
  </style>

  <title id="og-title">Snake - Grid Arcade</title>
  <desc id="og-desc">Link card: the SNAKE wordmark under a pixel snake mark on a dark grid, with the three difficulty presets.</desc>
  <defs>
    <linearGradient id="og-page" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0C1712"/>
      <stop offset="1" stop-color="#060B08"/>
    </linearGradient>
    <linearGradient id="og-body" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#157F47"/>
      <stop offset="0.55" stop-color="#3FD07A"/>
      <stop offset="1" stop-color="#8FF9B8"/>
    </linearGradient>
    <pattern id="og-cells" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="44" height="44" rx="8" fill="#0F1D16"/>
    </pattern>
    <radialGradient id="og-fade" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="og-mask">
      <rect width="1200" height="630" fill="url(#og-fade)"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#og-page)"/>
  <g mask="url(#og-mask)"><rect width="1200" height="630" fill="url(#og-cells)"/></g>

  <!-- pixel snake mark, 3x3 grid geometry shared with favicon.svg -->
  <g transform="translate(540 96) scale(2.5)">
    <rect width="48" height="48" rx="13" fill="#122619" stroke="#2B4C37" stroke-width="1.6"/>
    <g fill="url(#og-body)">
      <rect x="8.5" y="32.5" width="7" height="7" rx="2.3"/>
      <rect x="16.5" y="32.5" width="7" height="7" rx="2.3"/>
      <rect x="24.5" y="32.5" width="7" height="7" rx="2.3"/>
      <rect x="24.5" y="24.5" width="7" height="7" rx="2.3"/>
      <rect x="24.5" y="16.5" width="7" height="7" rx="2.3"/>
    </g>
    <rect x="32.5" y="16.5" width="7" height="7" rx="2.4" fill="#8FF9B8"/>
    <circle cx="37.2" cy="19.4" r="1.2" fill="#07120C"/>
    <circle cx="12" cy="12" r="3.4" fill="#FF6B57"/>
  </g>

  <text x="600" y="330" text-anchor="middle" fill="#EAF6EC" font-family="'Silkscreen', monospace" font-size="132" letter-spacing="6">SNAKE</text>
  <text x="600" y="376" text-anchor="middle" fill="#A7C3B0" font-family="'Space Grotesk', sans-serif" font-size="24">Eat, grow, do not hit yourself. Runs offline, in one file.</text>

  <g font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    <rect x="404" y="424" width="118" height="42" rx="10" fill="#0E1A13" stroke="#27402F" stroke-width="1.5"/>
    <text x="463" y="450" fill="#7FA98C" letter-spacing="1.4">CHILL</text>
    <rect x="541" y="424" width="118" height="42" rx="10" fill="#13281C" stroke="#3FD07A" stroke-width="1.8"/>
    <text x="600" y="450" fill="#CFF3D9" letter-spacing="1.4">CLASSIC</text>
    <rect x="678" y="424" width="118" height="42" rx="10" fill="#0E1A13" stroke="#27402F" stroke-width="1.5"/>
    <text x="737" y="450" fill="#7FA98C" letter-spacing="1.4">FRANTIC</text>
  </g>

  <text x="600" y="540" text-anchor="middle" fill="#44685A" font-family="'Space Grotesk', sans-serif" font-size="15" letter-spacing="1.2">SPACE / ARROWS OR WASD TO STEER - P PAUSES - M MUTES - R RESTARTS</text>
  <rect x="1" y="1" width="1198" height="628" rx="10" fill="none" stroke="#1C3125" stroke-width="2"/>
</svg>
